<script>
// Site-wide progressive enhancement: a reveal on scroll and a count-up on the
// home-page figures. Both are added from here and never from the markup, so a
// reader without JavaScript sees the finished page rather than an empty one.
// Both are skipped outright when the reader asks for reduced motion.
(function () {
  "use strict";

  function ready(fn) {
    if (document.readyState !== "loading") fn();
    else document.addEventListener("DOMContentLoaded", fn);
  }

  ready(function () {
    var calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (calm || !("IntersectionObserver" in window)) return;

    // ── reveal ────────────────────────────────────────────────────────────
    // Cards only. The 107 timeline entries are deliberately left out: a page
    // where every line fades in as you scroll reads as a gimmick, not a design.
    var targets = document.querySelectorAll(
      ".jfb-card, .course-card, .pp-card, .stat, .quarto-grid-item"
    );
    if (targets.length) {
      Array.prototype.forEach.call(targets, function (el) { el.classList.add("jfb-reveal"); });
      var revealer = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          e.target.classList.add("is-in");
          revealer.unobserve(e.target);
        });
      }, { rootMargin: "0px 0px -6% 0px", threshold: 0.04 });
      Array.prototype.forEach.call(targets, function (el) { revealer.observe(el); });
      // Safety net: whatever is still hidden after six seconds is shown anyway,
      // so a mis-set observer can never swallow the content. Long enough for the
      // effect to play, short enough that nobody waits on it.
      setTimeout(function () {
        Array.prototype.forEach.call(targets, function (el) { el.classList.add("is-in"); });
      }, 6000);
    }

    // No count-up on the figures. Animating them means that, for a moment,
    // the page states a number of publications that is false — and a slow or
    // throttled frame loop can leave it there. A decoration is not worth a
    // wrong figure.
  });
})();
</script>
