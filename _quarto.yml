project:
  type: website
  resources:
    # Pre-rendered postprints are standalone HTML bundles; Quarto doesn't crawl their
    # internal assets (figures/, *_files/, badge), so copy the whole tree verbatim.
    - postprints/
    # Downloadable files (the aggregated BibTeX is generated by make publications).
    - files/

lang: en

website:
  title: "Jean-François Barthélémy"
  description: "Researcher at Cerema / UMR MCD — micromechanics, homogenization and scientific computing."
  site-url: https://jfbarthelemy.github.io
  favicon: images/favicon.ico
  open-graph: true
  repo-url: https://github.com/jfbarthelemy/jfbarthelemy.github.io
  # No `repo-actions`: it renders a "View source" link at the foot of the
  # sidebar. The same link belongs in the navbar tools, beside the search and
  # the theme switch, as an icon.
  search:
    location: navbar
    type: overlay
  navbar:
    title: "J.-F. Barthélémy"
    background: light
    tools:
      - icon: github
        href: https://github.com/jfbarthelemy/jfbarthelemy.github.io
        text: "Source on GitHub"
    right:
      - href: index.qmd
        text: Home
      - href: software.qmd
        text: Software
      - href: publications.qmd
        text: Publications
      - href: postprints.qmd
        text: Postprints
      - href: teaching.qmd
        text: Teaching
      - href: about.qmd
        text: About
      # - href: files/cvjfb_en.pdf
      #   text: CV
  page-footer:
    left: |
      Jean-François Barthélémy — [Cerema](https://www.cerema.fr/en) · [UMR MCD](https://mcd.univ-gustave-eiffel.fr/)
    center: |
      [ORCID](https://orcid.org/0000-0002-1968-8939) · [GitHub](https://github.com/jfbarthelemy) · [HAL](https://hal.archives-ouvertes.fr/search/index/?q=%2A&authIdHal_s=jfbarthelemy)
    right: |
      Built with [Quarto](https://quarto.org)

editor:
  render-on-save: true

format:
  html:
    theme:
      light:
        - cosmo
        - _config/_tokens.scss
        - _config/theme-light.scss
      dark:
        - darkly
        - _config/_tokens.scss
        - _config/theme-dark.scss
    include-in-header: _config/head.html
    include-after-body: _config/enhance.html
    toc: false
    # A tinted band under the navbar carrying the page title and its subtitle.
    # Disabled on the home page, whose title block is the hero itself.
    title-block-banner: true
    page-layout: full
    code-overflow: wrap
    anchor-sections: true

execute:
  freeze: auto
