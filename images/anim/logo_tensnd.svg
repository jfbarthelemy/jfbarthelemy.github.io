<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>TensND — Calcul tensoriel en coordonnées curvilignes</title>
  <!-- Animated variant of ../logo_tensnd.svg: the curvilinear grid is drawn,
       then the frame turns into place — a change of basis. The last frame is
       the static logo exactly. -->
  <defs>
    <clipPath id="circ">
      <circle cx="256" cy="256" r="248"/>
    </clipPath>
  </defs>
  <style>
    .frame { transform-box: view-box; transform-origin: 256px 256px; }
    .origin { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .line   { animation: draw 0.7s ease-out both; }
      .l2 { animation-delay: 0.06s; } .l3 { animation-delay: 0.12s; } .l4 { animation-delay: 0.18s; }
      .l5 { animation-delay: 0.08s; } .l6 { animation-delay: 0.14s; } .l7 { animation-delay: 0.20s; }
      .l8 { animation-delay: 0.26s; }
      .frame  { animation: turn 1.3s 0.35s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .origin { animation: pop 0.5s 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
    }
    @keyframes draw {
      0%     { stroke-dasharray: 1; stroke-dashoffset: 1; }
      99.9%  { stroke-dasharray: 1; stroke-dashoffset: 0; }
      100%   { stroke-dasharray: none; }
    }
    @keyframes turn { from { opacity: 0; transform: rotate(-150deg) scale(0.55); } 30% { opacity: 1; } }
    @keyframes pop  { from { transform: scale(0); } }
  </style>
  <g clip-path="url(#circ)" fill="none" stroke="#888888" stroke-width="1.8" opacity="0.4">
    <path class="line l1" pathLength="1" d="M 62 172 Q 256 138 452 196"/>
    <path class="line l2" pathLength="1" d="M 58 228 Q 256 200 456 252"/>
    <path class="line l3" pathLength="1" d="M 62 298 Q 256 278 448 316"/>
    <path class="line l4" pathLength="1" d="M 72 358 Q 256 348 430 372"/>
    <path class="line l5" pathLength="1" d="M 148 62 Q 164 256 136 432"/>
    <path class="line l6" pathLength="1" d="M 212 56 Q 232 256 206 444"/>
    <path class="line l7" pathLength="1" d="M 308 58 Q 290 256 316 442"/>
    <path class="line l8" pathLength="1" d="M 372 68 Q 372 256 400 428"/>
  </g>
  <g class="frame">
    <line x1="256" y1="256" x2="379" y2="212" stroke="#CB3C33" stroke-width="15" stroke-linecap="round"/>
    <polygon points="402,203 383,223 374,200" fill="#CB3C33"/>
    <line x1="256" y1="256" x2="187" y2="158" stroke="#389826" stroke-width="15" stroke-linecap="round"/>
    <polygon points="173,137 197,151 178,164" fill="#389826"/>
    <line x1="256" y1="256" x2="179" y2="348" stroke="#9558B2" stroke-width="15" stroke-linecap="round"/>
    <polygon points="163,367 170,340 188,356" fill="#9558B2"/>
  </g>
  <circle class="origin" cx="256" cy="256" r="23" fill="#4063D8"/>
</svg>
