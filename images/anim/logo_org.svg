<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <title>MicroPoroChemoMechanics</title>
  <!-- Animated variant of ../logo_org.svg: the links of the triangle are drawn,
       the three disciplines come in, and the Julia heart beats once. The last
       frame is the static logo exactly. -->
  <style>
    .disc, .heart, .beat { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .link  { animation: draw 0.55s ease-out both; }
      .k2 { animation-delay: 0.12s; } .k3 { animation-delay: 0.24s; }
      .heart { animation: pop 0.5s 0.15s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      .disc  { animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      .d1 { animation-delay: 0.4s; } .d2 { animation-delay: 0.6s; } .d3 { animation-delay: 0.8s; }
      .beat  { animation: beat 0.6s 1.45s ease-in-out forwards; }
    }
    @keyframes draw {
      0%     { stroke-dasharray: 1; stroke-dashoffset: 1; }
      99.9%  { stroke-dasharray: 1; stroke-dashoffset: 0; }
      100%   { stroke-dasharray: none; }
    }
    @keyframes pop  { from { opacity: 0; transform: scale(0); } }
    @keyframes beat { 0%, 100% { transform: scale(1); } 35% { transform: scale(1.28); } 60% { transform: scale(0.96); } }
  </style>
  <!-- liens -->
  <g stroke="#CCCCCC" stroke-width="16" fill="none">
    <line class="link k1" pathLength="1" x1="300" y1="150" x2="165" y2="400"/>
    <line class="link k2" pathLength="1" x1="300" y1="150" x2="435" y2="400"/>
    <line class="link k3" pathLength="1" x1="165" y1="400" x2="435" y2="400"/>
  </g>
  <!-- coeur Julia -->
  <g class="heart"><circle class="beat" cx="300" cy="315" r="52" fill="#4063D8"/></g>
  <!-- chimie (ChemistryLab) -->
  <g class="disc d1">
    <circle cx="300" cy="150" r="115" fill="#CB3C33"/>
    <path d="M 285 85 L 315 85 L 315 125 L 355 195 Q 362 210 345 210 L 255 210 Q 238 210 245 195 L 285 125 Z" fill="#FFFFFF"/>
  </g>
  <!-- poromecanique / transport reactif (Bil : pore et menisque) -->
  <g class="disc d2">
    <circle cx="165" cy="400" r="115" fill="#9558B2"/>
    <circle cx="165" cy="400" r="58" fill="#FFFFFF"/>
    <path d="M 113 375 Q 165 418 217 375 A 58 58 0 1 1 113 375 Z" fill="#4063D8"/>
  </g>
  <!-- homogeneisation (MeanFieldHomogenization : inclusions variees) -->
  <g class="disc d3">
    <circle cx="435" cy="400" r="115" fill="#389826"/>
    <ellipse cx="410" cy="368" rx="46" ry="14" fill="#FFFFFF" transform="rotate(-25 410 368)"/>
    <circle cx="472" cy="415" r="22" fill="#FFFFFF"/>
    <ellipse cx="410" cy="443" rx="38" ry="5" fill="#FFFFFF" transform="rotate(-15 410 443)"/>
  </g>
</svg>
