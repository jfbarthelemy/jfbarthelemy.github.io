<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <title>OptimaSolver.jl</title>
  <!-- Animated variant of ../logo_optimasolver.svg: the axes and the Gibbs
       energy are drawn, then the iterates of the central path come down one
       after the other to the optimum. The last frame is the static logo
       exactly. -->
  <style>
    .it { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .axis  { animation: draw 0.45s ease-out both; }
      .axis + .axis { animation-delay: 0.15s; }
      .curve { animation: draw 0.85s 0.25s ease-in-out both; }
      .it    { animation: land 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      .it1 { animation-delay: 1.0s; } .it2 { animation-delay: 1.25s; }
      .it3 { animation-delay: 1.5s; } .it4 { animation-delay: 1.7s; }
    }
    @keyframes draw {
      0%     { stroke-dasharray: 1; stroke-dashoffset: 1; }
      99.9%  { stroke-dasharray: 1; stroke-dashoffset: 0; }
      100%   { stroke-dasharray: none; }
    }
    @keyframes land { from { opacity: 0; transform: scale(0); } }
  </style>
  <!-- axes -->
  <g stroke="#CCCCCC" stroke-width="16" stroke-linecap="round" fill="none">
    <line class="axis" pathLength="1" x1="112" y1="96" x2="112" y2="508"/>
    <line class="axis" pathLength="1" x1="112" y1="508" x2="524" y2="508"/>
  </g>
  <!-- energie de Gibbs : parabole exacte (Bezier quadratique), minimum en (325,430) -->
  <path class="curve" pathLength="1" d="M 150 140 Q 325 704 500 171" fill="none" stroke="#4063D8"
        stroke-width="30" stroke-linecap="round"/>
  <!-- chemin central : iteres successifs descendant vers l'optimum -->
  <circle class="it it1" cx="195" cy="270" r="30" fill="#CB3C33"/>
  <circle class="it it2" cx="255" cy="384" r="24" fill="#9558B2"/>
  <!-- optimum atteint -->
  <circle class="it it3" cx="325" cy="430" r="38" fill="#389826"/>
  <circle class="it it4" cx="325" cy="430" r="15" fill="#FFFFFF"/>
</svg>
