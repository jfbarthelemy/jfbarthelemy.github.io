<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <title>MeanFieldHomogenization.jl</title>
  <!-- Animated variant of ../logo_mfh.svg: the effective medium appears, then
       the four inclusions settle into it, each turning to its orientation. The
       last frame is the static logo exactly. -->
  <style>
    .medium, .inc { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .medium { animation: medium 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .inc    { animation: settle 0.9s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .i1 { --turn: -70deg; animation-delay: 0.3s; }
      .i2 { --turn: 0deg;   animation-delay: 0.5s; }
      .i3 { --turn: 55deg;  animation-delay: 0.7s; }
      .i4 { --turn: -95deg; animation-delay: 0.9s; }
    }
    @keyframes medium { from { opacity: 0; transform: scale(0.82); } }
    @keyframes settle { from { opacity: 0; transform: rotate(var(--turn)) scale(0.15); } }
  </style>
  <circle class="medium" cx="300" cy="300" r="240" fill="#DCE3E9"/>
  <g class="inc i1"><ellipse cx="225" cy="205" rx="92" ry="28" fill="#CB3C33" transform="rotate(-28 225 205)"/></g>
  <g class="inc i2"><circle cx="398" cy="268" r="56" fill="#389826"/></g>
  <g class="inc i3"><ellipse cx="232" cy="398" rx="80" ry="48" fill="#4063D8" transform="rotate(10 232 398)"/></g>
  <g class="inc i4"><ellipse cx="400" cy="428" rx="86" ry="9" fill="#9558B2" transform="rotate(-22 400 428)"/></g>
</svg>
