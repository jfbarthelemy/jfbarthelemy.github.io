<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="600" height="600" viewBox="-99 244 1027 1027">
  <title>ChemistryLab.jl</title>
  <!-- Animated variant of ../logo_chemistrylab.svg (Inkscape metadata and six
       invisible paths removed): the flask appears, the solution rises in it,
       and the bubbles come up from the surface, the lowest first. The last
       frame is the static logo exactly. -->
  <defs>
    <clipPath id="level">
      <rect class="level" x="70" y="765" width="685" height="440"/>
    </clipPath>
  </defs>
  <style>
    .glass, .level, .bubble { transform-box: fill-box; }
    .glass { transform-origin: 50% 100%; }
    .level { transform-origin: 50% 100%; }
    .bubble { transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .glass  { animation: glass 0.55s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .level  { animation: fill 0.8s 0.3s cubic-bezier(0.45, 0, 0.25, 1) both; }
      .bubble { animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .b1 { animation-delay: 0.95s; }
      .b2 { animation-delay: 1.06s; }
      .b3 { animation-delay: 1.17s; }
      .b4 { animation-delay: 1.28s; }
      .b5 { animation-delay: 1.39s; }
      .b6 { animation-delay: 1.50s; }
      .b7 { animation-delay: 1.61s; }
      .b8 { animation-delay: 1.72s; }
    }
    @keyframes glass { from { opacity: 0; transform: translateY(24px) scale(0.96); } }
    @keyframes fill  { from { transform: scaleY(0); } }
    @keyframes rise  { from { opacity: 0; transform: translateY(70px) scale(0.4); } }
  </style>
